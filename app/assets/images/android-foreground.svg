<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CineLog">
  <!-- Adaptive-icon foreground: art stays inside the 66% safe zone so Android's
       mask never clips the reel. -->
  <defs>
    <linearGradient id="cinelogFg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3B5C"/>
      <stop offset="1" stop-color="#B00C22"/>
    </linearGradient>
  </defs>
  <g transform="translate(146 146) scale(0.4297)">
    <rect x="0" y="0" width="512" height="512" rx="133" fill="url(#cinelogFg)"/>
  <!-- Film-strip perforations down the left edge. -->
  <g fill="#F5F6F8" opacity="0.95">
    <rect x="58" y="92" width="52" height="52" rx="18"/>
    <rect x="58" y="178" width="52" height="52" rx="18"/>
    <rect x="58" y="264" width="52" height="52" rx="18"/>
    <rect x="58" y="350" width="52" height="52" rx="18"/>
  </g>
  <!-- The "C" of CineLog, drawn as an open film reel. -->
  <path
    d="M 397.7 176.9 A 118 118 0 1 0 397.7 335.1"
    fill="none"
    stroke="#F5F6F8"
    stroke-width="54"
    stroke-linecap="round"
  />
  </g>
</svg>
